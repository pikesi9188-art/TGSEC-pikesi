id: doris-unauth-surface

info:
  name: Apache Doris FE HTTP Unauth Surface
  author: survey-engine
  severity: high
  description: |
    Apache Doris FE HTTP（默认 8030）指纹与未鉴权管理/查询面。
    空口令 MySQL 9030 与 /api/query 翻库走 doris_probe.py。
    CVE-2026-58319：<3.1.0 管理 REST 未鉴权（本模板只 GET 指纹）。
  tags: doris,starrocks,unauth,olap,cve2026,fingerprint
  reference:
    - https://nvd.nist.gov/vuln/detail/CVE-2026-58319
    - https://doris.apache.org/docs/3.x/admin-manual/config/fe-config/

http:
  - method: GET
    path:
      - "{{BaseURL}}/rest/v1/system"
      - "{{BaseURL}}/api/bootstrap"
      - "{{BaseURL}}/api/backends"
      - "{{BaseURL}}/api/v1/catalogs"
      - "{{BaseURL}}/"

    stop-at-first-match: false
    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - "Apache Doris"
          - "default_cluster"
          - "Palo FE"
          - "StarRocks"
        condition: or
        name: fe-body
        case-insensitive: true

      - type: word
        part: body
        words:
          - "frontend"
          - "backends"
        condition: and
        name: rest-system
