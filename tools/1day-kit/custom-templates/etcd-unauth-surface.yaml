id: etcd-unauth-surface

info:
  name: etcd Unauthenticated Version/Keys Surface
  author: survey-engine
  severity: high
  description: |
    etcd 未鉴权暴露面指纹（/version、/v2/keys/）。
    CVE-2026-73499 Watch 越权另按手法卡验证；不做 73500 DoS。
  tags: etcd,unauth,k8s,cve2026,fingerprint
  reference:
    - https://cvebase.io/cve/CVE-2026-73499

http:
  - method: GET
    path:
      - "{{BaseURL}}/version"
      - "{{BaseURL}}/v2/keys/"

    stop-at-first-match: false
    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - "etcdserver"
          - "etcdcluster"
        condition: or
        name: version

      - type: word
        part: body
        words:
          - '"node"'
          - '"key"'
        condition: and
        name: v2-keys
